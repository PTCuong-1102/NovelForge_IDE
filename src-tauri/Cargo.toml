[package]
name = "novelforge-ide"
version = "0.0.1"
description = "NovelForge IDE — Specialized Desktop IDE for Novelists & Creators"
authors = ["NovelForge Team"]
edition = "2021"

[lib]
name = "novelforge_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
pulldown-cmark = "0.12.2"
aho-corasick = "1.1.3"
similar = { version = "2.6.0", features = ["inline"] }
git2 = "0.19.0"
sha2 = "0.10.8"
chrono = { version = "0.4.39", features = ["serde"] }
notify = "8.2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[dev-dependencies]
tempfile = "3"
